<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soccer Hangman</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf7ed;color:#17351f;font-family:system-ui,-apple-system,sans-serif;padding:18px}main{max-width:650px;margin:auto}.back{color:#164d2a;text-decoration:none;font-weight:800}h1{text-align:center;font-size:38px;margin:12px 0 4px}.sub{text-align:center;color:#65746a}.card{background:white;padding:15px;border-radius:20px;box-shadow:0 5px 18px #0002}.field{height:150px;background:#398b53;border-radius:14px;position:relative;overflow:hidden;border:3px solid white}.field:after{content:"";position:absolute;inset:10px;border:2px solid #fffb}.goal{position:absolute;right:10px;top:40px;width:55px;height:70px;border:3px solid white;border-right:0}.ball{position:absolute;z-index:2;left:18%;bottom:22px;font-size:35px;transition:.35s}.word{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:18px 0}.slot{width:25px;height:37px;border-bottom:3px solid;font-size:26px;font-weight:900;text-align:center}.space{border:0;width:12px}.info{text-align:center;font-weight:800;min-height:25px}.hint{text-align:center;color:#65746a;min-height:24px}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.key{min-height:42px;border:0;border-radius:9px;font-size:17px;font-weight:800;background:#e3eee5}.key:disabled{opacity:.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{min-height:48px;border:0;border-radius:12px;font-weight:800;font-size:16px;background:#2f7d45;color:white}.secondary{background:#e5ece7;color:#17351f}
</style></head><body><main><a class="back" href="index.html">‹ Kid Arcade</a><h1>⚽ Soccer Hangman</h1><p class="sub">Guess the soccer word before six misses!</p><div class="card"><div class="field"><div class="goal"></div><div id="ball" class="ball">⚽</div></div><div id="misses" class="info"></div><div id="word" class="word"></div><div id="hint" class="hint"></div><div id="status" class="info"></div><div id="keys" class="keys"></div><div class="actions"><button id="hintBtn" class="action secondary">Give Me a Hint</button><button id="newBtn" class="action">New Word</button></div></div></main>
<script>
const W=[
["GOALKEEPER","The player allowed to use their hands near their own goal."],["STRIKER","A player whose main job is scoring."],["DEFENDER","Helps protect the team's goal."],["MIDFIELDER","Plays between defenders and forwards."],["CAPTAIN","The team's on-field leader."],["REFEREE","Enforces the rules."],["CORNER KICK","A restart taken from a corner of the field."],["FREE KICK","A restart awarded after certain fouls."],["PENALTY","A one-on-one kick from the penalty spot."],["OFFSIDE","A rule stopping attackers waiting too close to goal."],["DRIBBLE","Moving while keeping the ball under control."],["TACKLE","Trying to legally win the ball from an opponent."],["HEADER","Playing the ball with your head."],["CROSSBAR","The horizontal top part of the goal."],["TOUCHLINE","The long boundary line along the side."],["WHISTLE","The referee uses this to stop play."],["SHIN GUARDS","Protective equipment worn under socks."],["CLEATS","Shoes made to grip the field."],["HAT TRICK","Three goals by one player in a match."],["WORLD CUP","The biggest international soccer tournament."],["EXTRA TIME","Additional periods in some tied knockout matches."],["YELLOW CARD","A referee's warning."],["RED CARD","This sends a player out of the match."],["KICKOFF","How a half or play after a goal begins."],["SUBSTITUTE","A player who enters for a teammate."],["VOLLEY","Kicking the ball before it hits the ground."],["BICYCLE KICK","An acrobatic overhead shot."],["NUTMEG","Playing the ball through an opponent's legs."],["CLEAN SHEET","A match in which a team allows no goals."],["PENALTY AREA","The large box in front of the goal."]
];
let cur,g=new Set(),wrong=0,done=false;
const word=document.querySelector("#word"),keys=document.querySelector("#keys"),status=document.querySelector("#status"),misses=document.querySelector("#misses"),hint=document.querySelector("#hint"),ball=document.querySelector("#ball");
function start(){cur=W[Math.floor(Math.random()*W.length)];g=new Set;wrong=0;done=false;status.textContent="";hint.textContent="";keys.innerHTML="";for(const l of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){let b=document.createElement("button");b.className="key";b.textContent=l;b.onclick=()=>guess(l,b);keys.appendChild(b)}render()}
function render(){word.innerHTML="";for(const c of cur[0]){let d=document.createElement("div");d.className=c===" "?"slot space":"slot";d.textContent=c===" "?"":g.has(c)?c:"";word.appendChild(d)}misses.textContent=`Misses: ${wrong} / 6`;ball.style.left=(18+wrong*11)+"%";ball.style.transform=`rotate(${wrong*70}deg)`;let letters=[...cur[0]].filter(c=>c!==" ");if(letters.every(c=>g.has(c))&&!done){done=true;status.textContent="🏆 GOAL! You got it!";disable()}else if(wrong>=6&&!done){done=true;status.textContent="🥅 Saved! The word was "+cur[0]+".";for(const c of letters)g.add(c);disable();renderWord()}}
function renderWord(){word.innerHTML="";for(const c of cur[0]){let d=document.createElement("div");d.className=c===" "?"slot space":"slot";d.textContent=c===" "?"":c;word.appendChild(d)}}
function guess(l,b){if(done)return;g.add(l);b.disabled=true;if(!cur[0].includes(l))wrong++;render()}
function disable(){document.querySelectorAll(".key").forEach(b=>b.disabled=true)}
document.querySelector("#newBtn").onclick=start;document.querySelector("#hintBtn").onclick=()=>{if(!done)hint.textContent="💡 "+cur[1]};start();
</script></body></html>
