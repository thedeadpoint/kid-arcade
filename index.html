<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef">
<title>Kid Arcade</title>
<style>
  :root {
    --bg: #f5f4ef;
    --text: #1f2933;
    --muted: #667085;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: max(28px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    padding: 22px 0 28px;
  }
  h1 {
    margin: 0;
    font-size: clamp(38px, 11vw, 62px);
    letter-spacing: -0.04em;
  }
  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 18px;
  }
  .games {
    display: grid;
    gap: 16px;
  }
  .game {
    display: grid;
    grid-template-columns: 76px 1fr 28px;
    align-items: center;
    min-height: 112px;
    padding: 16px;
    background: var(--card);
    border-radius: 22px;
    color: inherit;
    text-decoration: none;
    box-shadow: 0 6px 22px rgba(0,0,0,.08);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .game:active {
    transform: scale(.98);
  }
  .icon {
    font-size: 50px;
    text-align: center;
  }
  .name {
    font-size: 23px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .description {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.3;
  }
  .arrow {
    font-size: 32px;
    color: #98a2b3;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 30px 0 10px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎮 Kid Arcade</h1>
    <p class="subtitle">Pick a game and play.</p>
  </header>

  <section class="games">
    <a class="game" href="photo_puzzle.html">
      <div class="icon">🧩</div>
      <div>
        <div class="name">Photo Puzzle</div>
        <div class="description">Turn one of your photos into a puzzle.</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="game" href="photo_memory.html">
      <div class="icon">🃏</div>
      <div>
        <div class="name">Photo Memory</div>
        <div class="description">Pick your own photos and find the matching pairs.</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </section>

  <footer>No ads. No accounts. Just games.</footer>
</main>
</body>
</html>
